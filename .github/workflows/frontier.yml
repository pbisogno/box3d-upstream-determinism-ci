          print({'step_outcomes': outcomes})
          if any(value != 'success' for value in outcomes.values()):
              raise SystemExit(1)

  workers-two:
    needs: canonical
    if: ${{ always() && !cancelled() && github.event.repository.visibility == 'public' && inputs.mode == 'full' }}
    name: Worker profile / ${{ matrix.origin }} / W2
    runs-on: ${{ matrix.runner }}
