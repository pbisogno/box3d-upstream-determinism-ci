name: Public Box3D frontier diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Five canonical profiles or the expanded worker/build/SIMD matrix
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
      quality_timing:
        description: Include exploratory timing records (excluded from numeric digests)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-frontier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canonical:
    if: github.event.repository.visibility == 'public'
    name: Canonical / ${{ matrix.origin }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - origin: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 1
    steps:
      - name: Checkout generic sources
        id: sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream
        id: upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        id: inventory
        shell: python
        run: |
          import subprocess
          subprocess.run(['python', '-B', 'ci.py', 'inventory', '--expected-arch', '${{ matrix.arch }}'], check=True)
      - name: Build and run frontier diagnostics
        id: frontier
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.upstream.outcome == 'success' && steps.inventory.outcome == 'success' }}
        continue-on-error: true
        env:
          FRONTIER_QUALITY_TIMING: ${{ inputs.quality_timing }}
        shell: python
        run: |
          import os, subprocess
          args = ['python', '-B', 'frontier_ci.py', 'run',
                  '--origin', '${{ matrix.origin }}', '--compiler', '${{ matrix.compiler }}',
                  '--config', '${{ matrix.config }}', '--simd', '${{ matrix.simd }}',
                  '--workers', '${{ matrix.workers }}', '--parallel', '2', '--timeout', '900']
          if os.environ.get('FRONTIER_QUALITY_TIMING', '').casefold() == 'true':
              args.append('--quality-timing')
          subprocess.run(args, check=True)
      - name: Require completed measurement gates
        if: always()
        shell: python
        run: |
          outcomes = {'sources': '${{ steps.sources.outcome }}',
                      'upstream': '${{ steps.upstream.outcome }}',
                      'inventory': '${{ steps.inventory.outcome }}',
                      'frontier': '${{ steps.frontier.outcome }}'}
          print({'step_outcomes': outcomes})
          if any(value != 'success' for value in outcomes.values()):
              raise SystemExit(1)

