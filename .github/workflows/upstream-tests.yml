name: Upstream Box3D tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.repository.visibility == 'public'
    name: ${{ matrix.target }} / ${{ matrix.config }} / SIMD${{ matrix.simd }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: Debug
            simd: 4
          - target: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: Debug
            simd: 8
          - target: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: RelWithDebInfo
            simd: 4
          - target: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: RelWithDebInfo
            simd: 8
          - target: windows-clang-cl-x64
            runner: windows-2022
            arch: x86_64
            compiler: clang-cl
            config: Debug
            simd: 4
          - target: windows-clang-cl-x64
            runner: windows-2022
            arch: x86_64
            compiler: clang-cl
            config: Debug
            simd: 8
          - target: windows-clang-cl-x64
            runner: windows-2022
            arch: x86_64
            compiler: clang-cl
            config: RelWithDebInfo
            simd: 4
          - target: windows-clang-cl-x64
            runner: windows-2022
            arch: x86_64
            compiler: clang-cl
            config: RelWithDebInfo
            simd: 8
          - target: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: Debug
            simd: 4
          - target: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: Debug
            simd: 8
          - target: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: RelWithDebInfo
            simd: 4
          - target: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: RelWithDebInfo
            simd: 8
          - target: linux-clang-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: clang
            config: Debug
            simd: 4
          - target: linux-clang-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: clang
            config: Debug
            simd: 8
          - target: linux-clang-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
          - target: linux-clang-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 8
          - target: linux-gcc-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: gcc
            config: Debug
            simd: 4
          - target: linux-gcc-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: gcc
            config: RelWithDebInfo
            simd: 4
          - target: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
            config: Debug
            simd: 4
          - target: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
          - target: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
            config: Debug
            simd: 4
          - target: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
          - target: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: Debug
            simd: 4
          - target: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: Debug
            simd: 8
          - target: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
          - target: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 8
    steps:
      - name: Checkout generic CI sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "inventory", "--expected-arch", "${{ matrix.arch }}"], check=True)
      - name: Run unchanged upstream test suites
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "test", "--compiler", "${{ matrix.compiler }}", "--config", "${{ matrix.config }}", "--simd", "${{ matrix.simd }}"], check=True)

  capture_windows:
    if: github.event.repository.visibility == 'public'
    name: Public recording / windows-msvc-x64
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      recording: ${{ steps.emit.outputs.recording }}
    steps:
      - name: Checkout generic CI sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "inventory", "--expected-arch", "x86_64"], check=True)
      - name: Capture and locally verify public recording
        id: emit
        shell: python
        env:
          PUBLIC_ORIGIN: windows-msvc-x64
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "capture", "--compiler", "msvc", "--config", "RelWithDebInfo", "--output-key", "recording"], check=True)

  capture_linux_x64:
    if: github.event.repository.visibility == 'public'
    name: Public recording / linux-gcc-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      recording: ${{ steps.emit.outputs.recording }}
    steps:
      - name: Checkout generic CI sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "inventory", "--expected-arch", "x86_64"], check=True)
      - name: Capture and locally verify public recording
        id: emit
        shell: python
        env:
          PUBLIC_ORIGIN: linux-gcc-x64
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "capture", "--compiler", "gcc", "--config", "RelWithDebInfo", "--output-key", "recording"], check=True)

  capture_linux_arm64:
    if: github.event.repository.visibility == 'public'
    name: Public recording / linux-clang-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    outputs:
      recording: ${{ steps.emit.outputs.recording }}
    steps:
      - name: Checkout generic CI sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "inventory", "--expected-arch", "arm64"], check=True)
      - name: Capture and locally verify public recording
        id: emit
        shell: python
        env:
          PUBLIC_ORIGIN: linux-clang-arm64
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "capture", "--compiler", "clang", "--config", "RelWithDebInfo", "--output-key", "recording"], check=True)

  capture_macos:
    if: github.event.repository.visibility == 'public'
    name: Public recording / macos-clang-arm64
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      recording: ${{ steps.emit.outputs.recording }}
    steps:
      - name: Checkout generic CI sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "inventory", "--expected-arch", "arm64"], check=True)
      - name: Capture and locally verify public recording
        id: emit
        shell: python
        env:
          PUBLIC_ORIGIN: macos-clang-arm64
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "capture", "--compiler", "clang", "--config", "RelWithDebInfo", "--output-key", "recording"], check=True)

  consume:
    if: github.event.repository.visibility == 'public'
    needs: [capture_windows, capture_linux_x64, capture_linux_arm64, capture_macos]
    name: Cross-host replay / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
          - target: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
          - target: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
          - target: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
    steps:
      - name: Checkout generic CI sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout unchanged upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "inventory", "--expected-arch", "${{ matrix.arch }}"], check=True)
      - name: Replay exact public recordings from every producer
        shell: python
        env:
          PUBLIC_RECORDINGS_JSON: ${{ toJSON(needs) }}
        run: |
          import subprocess
          subprocess.run(["python", "ci.py", "consume", "--compiler", "${{ matrix.compiler }}", "--config", "RelWithDebInfo"], check=True)
