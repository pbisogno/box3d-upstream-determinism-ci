          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
          with:
            fetch-depth: 1
            persist-credentials: false
        - name: Checkout pinned upstream source
          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
          with:
            repository: erincatto/box3d
            ref: 5d83df83ab47172c2c745b44315e7538ead02397
            path: upstream
            fetch-depth: 1
            persist-credentials: false
        - name: Verify pinned public source and runner
          shell: python
          run: |
            import subprocess
            subprocess.run(["python", "-B", "ci.py", "inventory", "--expected-arch", "x86_64"], check=True)
        - name: Produce the four public transport cases
          id: native
          shell: python
          run: |
            import subprocess
            subprocess.run(["python", "-B", "snapshotlab_ci.py", "produce", "--profile", "linux-gcc-x64", "--compiler", "gcc", "--config", "RelWithDebInfo", "--simd", "4", "--workers", "1", "--bodies", "64", "--parallel", "2", "--timeout", "900"], check=True)
