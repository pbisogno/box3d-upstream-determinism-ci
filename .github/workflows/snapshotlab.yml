name: Snapshot transport and raw cost measurements

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Cross-origin transport and independent workload measurements
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
permissions:
  contents: read
concurrency:
  group: snapshotlab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  produce_gcc_x64_n64:
    if: ${{ github.event.repository.visibility == 'public' && (inputs.mode == 'full' || (true)) }}
    name: Produce / linux-gcc-x64 / 64 bodies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      bundle_meta: ${{ steps.native.outputs.bundle_meta }}
      bundle_count: ${{ steps.native.outputs.bundle_count }}
      bundle_00: ${{ steps.native.outputs.bundle_00 }}
      bundle_01: ${{ steps.native.outputs.bundle_01 }}
