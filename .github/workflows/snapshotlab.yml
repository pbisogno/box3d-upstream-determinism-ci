    needs: [produce_gcc_x64_n64, produce_gcc_x64_n256, produce_clang_arm64_n64, produce_clang_arm64_n256, produce_msvc_x64_n64, produce_msvc_x64_n256, produce_macos_arm64_n64, produce_macos_arm64_n256, consume_gcc_x64_n64, consume_gcc_x64_n256, consume_clang_arm64_n64, consume_clang_arm64_n256, consume_msvc_x64_n64, consume_msvc_x64_n256, consume_macos_arm64_n64, consume_macos_arm64_n256, cost_gcc_x64, cost_clang_arm64, cost_msvc_x64, cost_macos_arm64]
    if: ${{ always() && !cancelled() && github.event.repository.visibility == 'public' }}
    name: Check active execution jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every active run to complete
        shell: python
        env:
          MODE: ${{ inputs.mode }}
          ST_PRODUCE_GCC_X64_N64: ${{ needs.produce_gcc_x64_n64.result }}
          ST_PRODUCE_GCC_X64_N256: ${{ needs.produce_gcc_x64_n256.result }}
          ST_PRODUCE_CLANG_ARM64_N64: ${{ needs.produce_clang_arm64_n64.result }}
          ST_PRODUCE_CLANG_ARM64_N256: ${{ needs.produce_clang_arm64_n256.result }}
          ST_PRODUCE_MSVC_X64_N64: ${{ needs.produce_msvc_x64_n64.result }}
          ST_PRODUCE_MSVC_X64_N256: ${{ needs.produce_msvc_x64_n256.result }}
          ST_PRODUCE_MACOS_ARM64_N64: ${{ needs.produce_macos_arm64_n64.result }}
          ST_PRODUCE_MACOS_ARM64_N256: ${{ needs.produce_macos_arm64_n256.result }}
          ST_CONSUME_GCC_X64_N64: ${{ needs.consume_gcc_x64_n64.result }}
          ST_CONSUME_GCC_X64_N256: ${{ needs.consume_gcc_x64_n256.result }}
          ST_CONSUME_CLANG_ARM64_N64: ${{ needs.consume_clang_arm64_n64.result }}
          ST_CONSUME_CLANG_ARM64_N256: ${{ needs.consume_clang_arm64_n256.result }}
          ST_CONSUME_MSVC_X64_N64: ${{ needs.consume_msvc_x64_n64.result }}
          ST_CONSUME_MSVC_X64_N256: ${{ needs.consume_msvc_x64_n256.result }}
          ST_CONSUME_MACOS_ARM64_N64: ${{ needs.consume_macos_arm64_n64.result }}
          ST_CONSUME_MACOS_ARM64_N256: ${{ needs.consume_macos_arm64_n256.result }}
          ST_COST_GCC_X64: ${{ needs.cost_gcc_x64.result }}
          ST_COST_CLANG_ARM64: ${{ needs.cost_clang_arm64.result }}
          ST_COST_MSVC_X64: ${{ needs.cost_msvc_x64.result }}
          ST_COST_MACOS_ARM64: ${{ needs.cost_macos_arm64.result }}
        run: |
            import os, sys
            mode = os.environ['MODE']
            active = ['gcc_x64', 'clang_arm64'] if mode == 'smoke' else ['gcc_x64', 'clang_arm64', 'msvc_x64', 'macos_arm64']
            required = []
            for origin in active:
                required.append('COST_' + origin.upper())
                for bodies in (64, 256):
                    required.extend(('PRODUCE_' + origin.upper() + '_N' + str(bodies), 'CONSUME_' + origin.upper() + '_N' + str(bodies)))
            failed = {key: os.environ.get('ST_' + key, 'missing') for key in required if os.environ.get('ST_' + key) != 'success'}
            print({'mode': mode, 'required_jobs': len(required), 'failed_jobs': failed})
            sys.exit(1 if failed else 0)
