        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "produce", "--compiler", "clang", "--config", "RelWithDebInfo", "--build", "stress-build"],check=True)

  restore_relwithdebinfo:
    if: github.event.repository.visibility == 'public'
    name: Restore / ${{ matrix.target }} / RelWithDebInfo / workers4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
          - target: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
          - target: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
          - target: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
          - target: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','ci.py','inventory','--expected-arch','${{ matrix.arch }}'],check=True)
      - name: Compare repeated restorations to original fields
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "stress", "--compiler", "${{ matrix.compiler }}", "--config", "RelWithDebInfo", "--workers", "4", "--cycles", "100", "--build", "stress-build"],check=True)

  restore_debug:
    if: github.event.repository.visibility == 'public' && inputs.mode == 'full'
    name: Restore / ${{ matrix.target }} / Debug / workers4
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
          - target: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
          - target: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
          - target: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
          - target: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','ci.py','inventory','--expected-arch','${{ matrix.arch }}'],check=True)
      - name: Compare repeated restorations to original fields
        shell: python
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "stress", "--compiler", "${{ matrix.compiler }}", "--config", "Debug", "--workers", "4", "--cycles", "100", "--build", "stress-build"],check=True)

  consume:
    if: github.event.repository.visibility == 'public' && inputs.mode == 'full'
    needs: [capture_windows, capture_linux_x64, capture_linux_arm64, capture_macos_arm64, capture_macos_intel]
    name: Cross-host / ${{ matrix.target }} / ${{ matrix.config }} / workers${{ matrix.workers }} / AVX2${{ matrix.avx2 }}
