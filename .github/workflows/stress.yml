      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','ci.py','inventory','--expected-arch','${{ matrix.arch }}'],check=True)
      - name: Replay exact contacts records from all five origins
        id: case_contacts
        continue-on-error: true
        shell: python
        env:
          PUBLIC_RECORD_WINDOWS: ${{ needs.capture_windows.outputs.contacts }}
          PUBLIC_RECORD_LINUX_X64: ${{ needs.capture_linux_x64.outputs.contacts }}
          PUBLIC_RECORD_LINUX_ARM64: ${{ needs.capture_linux_arm64.outputs.contacts }}
          PUBLIC_RECORD_MACOS_ARM64: ${{ needs.capture_macos_arm64.outputs.contacts }}
          PUBLIC_RECORD_MACOS_INTEL: ${{ needs.capture_macos_intel.outputs.contacts }}
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "consume", "--case", "contacts", "--compiler", "${{ matrix.compiler }}", "--config", "${{ matrix.config }}", "--simd", "${{ matrix.simd }}", "--workers", "${{ matrix.workers }}", "--cycles", "4", "--build", "stress-build"],check=True)
      - name: Replay exact joints records from all five origins
        id: case_joints
        continue-on-error: true
        shell: python
        env:
          PUBLIC_RECORD_WINDOWS: ${{ needs.capture_windows.outputs.joints }}
          PUBLIC_RECORD_LINUX_X64: ${{ needs.capture_linux_x64.outputs.joints }}
          PUBLIC_RECORD_LINUX_ARM64: ${{ needs.capture_linux_arm64.outputs.joints }}
          PUBLIC_RECORD_MACOS_ARM64: ${{ needs.capture_macos_arm64.outputs.joints }}
          PUBLIC_RECORD_MACOS_INTEL: ${{ needs.capture_macos_intel.outputs.joints }}
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "consume", "--case", "joints", "--compiler", "${{ matrix.compiler }}", "--config", "${{ matrix.config }}", "--simd", "${{ matrix.simd }}", "--workers", "${{ matrix.workers }}", "--cycles", "4", "--build", "stress-build"],check=True)
      - name: Replay exact lifecycle records from all five origins
        id: case_lifecycle
        continue-on-error: true
        shell: python
        env:
          PUBLIC_RECORD_WINDOWS: ${{ needs.capture_windows.outputs.lifecycle }}
          PUBLIC_RECORD_LINUX_X64: ${{ needs.capture_linux_x64.outputs.lifecycle }}
          PUBLIC_RECORD_LINUX_ARM64: ${{ needs.capture_linux_arm64.outputs.lifecycle }}
          PUBLIC_RECORD_MACOS_ARM64: ${{ needs.capture_macos_arm64.outputs.lifecycle }}
          PUBLIC_RECORD_MACOS_INTEL: ${{ needs.capture_macos_intel.outputs.lifecycle }}
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "consume", "--case", "lifecycle", "--compiler", "${{ matrix.compiler }}", "--config", "${{ matrix.config }}", "--simd", "${{ matrix.simd }}", "--workers", "${{ matrix.workers }}", "--cycles", "4", "--build", "stress-build"],check=True)
