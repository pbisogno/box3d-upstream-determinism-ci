name: Public scene replay and restore tests
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded smoke run or expanded public matrix
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
permissions:
  contents: read
concurrency:
  group: public-stress-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture_windows:
    if: github.event.repository.visibility == 'public'
    name: Public scenes / windows-msvc-x64
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      contacts_0: ${{ steps.emit.outputs.contacts_0 }}
      contacts_1: ${{ steps.emit.outputs.contacts_1 }}
      contacts_2: ${{ steps.emit.outputs.contacts_2 }}
      contacts_3: ${{ steps.emit.outputs.contacts_3 }}
      contacts_4: ${{ steps.emit.outputs.contacts_4 }}
      contacts_5: ${{ steps.emit.outputs.contacts_5 }}
      joints_0: ${{ steps.emit.outputs.joints_0 }}
      joints_1: ${{ steps.emit.outputs.joints_1 }}
      joints_2: ${{ steps.emit.outputs.joints_2 }}
      joints_3: ${{ steps.emit.outputs.joints_3 }}
      joints_4: ${{ steps.emit.outputs.joints_4 }}
      joints_5: ${{ steps.emit.outputs.joints_5 }}
      lifecycle_0: ${{ steps.emit.outputs.lifecycle_0 }}
      lifecycle_1: ${{ steps.emit.outputs.lifecycle_1 }}
      lifecycle_2: ${{ steps.emit.outputs.lifecycle_2 }}
      lifecycle_3: ${{ steps.emit.outputs.lifecycle_3 }}
      lifecycle_4: ${{ steps.emit.outputs.lifecycle_4 }}
      lifecycle_5: ${{ steps.emit.outputs.lifecycle_5 }}
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','ci.py','inventory','--expected-arch','x86_64'],check=True)
      - name: Capture and verify three public scenes
        id: emit
        shell: python
        env:
          PUBLIC_ORIGIN: windows-msvc-x64
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "produce", "--compiler", "msvc", "--config", "RelWithDebInfo", "--build", "stress-build"],check=True)

