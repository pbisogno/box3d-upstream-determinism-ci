          subprocess.run(["python", "stress_ci.py", "produce", "--compiler", "clang", "--config", "RelWithDebInfo", "--build", "stress-build"],check=True)

  capture_macos_intel:
    if: github.event.repository.visibility == 'public'
    name: Public scenes / macos-clang-x64
    runs-on: macos-15-intel
    timeout-minutes: 20
    outputs:
      contacts: ${{ steps.emit.outputs.contacts }}
      joints: ${{ steps.emit.outputs.joints }}
      lifecycle: ${{ steps.emit.outputs.lifecycle }}
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
