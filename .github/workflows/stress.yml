      lifecycle_1: ${{ steps.emit.outputs.lifecycle_1 }}
      lifecycle_2: ${{ steps.emit.outputs.lifecycle_2 }}
      lifecycle_3: ${{ steps.emit.outputs.lifecycle_3 }}
