          subprocess.run(["python", "stress_ci.py", "produce", "--compiler", "clang", "--config", "RelWithDebInfo", "--build", "stress-build"],check=True)

  capture_macos_arm64:
    if: github.event.repository.visibility == 'public'
    name: Public scenes / macos-clang-arm64
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      contacts: ${{ steps.emit.outputs.contacts }}
      joints: ${{ steps.emit.outputs.joints }}
      lifecycle: ${{ steps.emit.outputs.lifecycle }}
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
