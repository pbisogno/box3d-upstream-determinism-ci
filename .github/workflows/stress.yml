name: Public scene replay and restore tests
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded smoke run or expanded public matrix
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
permissions:
  contents: read
concurrency:
  group: public-stress-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture_windows:
    if: github.event.repository.visibility == 'public'
    name: Public scenes / windows-msvc-x64
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      contacts: ${{ steps.emit.outputs.contacts }}
      joints: ${{ steps.emit.outputs.joints }}
      lifecycle: ${{ steps.emit.outputs.lifecycle }}
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','ci.py','inventory','--expected-arch','x86_64'],check=True)
      - name: Capture and verify three public scenes
        id: emit
        shell: python
        env:
          PUBLIC_ORIGIN: windows-msvc-x64
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "produce", "--compiler", "msvc", "--config", "RelWithDebInfo", "--build", "stress-build"],check=True)

  capture_linux_x64:
    if: github.event.repository.visibility == 'public'
    name: Public scenes / linux-gcc-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      contacts: ${{ steps.emit.outputs.contacts }}
      joints: ${{ steps.emit.outputs.joints }}
      lifecycle: ${{ steps.emit.outputs.lifecycle }}
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','ci.py','inventory','--expected-arch','x86_64'],check=True)
      - name: Capture and verify three public scenes
        id: emit
        shell: python
        env:
          PUBLIC_ORIGIN: linux-gcc-x64
        run: |
          import subprocess
          subprocess.run(["python", "stress_ci.py", "produce", "--compiler", "gcc", "--config", "RelWithDebInfo", "--build", "stress-build"],check=True)

  capture_linux_arm64:
    if: github.event.repository.visibility == 'public'
    name: Public scenes / linux-clang-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      contacts: ${{ steps.emit.outputs.contacts }}
      joints: ${{ steps.emit.outputs.joints }}
      lifecycle: ${{ steps.emit.outputs.lifecycle }}
    steps:
      - name: Checkout generic sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
