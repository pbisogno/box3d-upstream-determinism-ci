name: Public cache intervention tests
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Five canonical profiles or expanded worker/build/SIMD controls
        required: true
        default: smoke
        type: choice
        options: [smoke, full]
permissions:
  contents: read
concurrency:
  group: public-causal-${{ github.ref }}
  cancel-in-progress: false
jobs:
  canonical:
    if: github.event.repository.visibility == 'public'
    name: Canonical / ${{ matrix.origin }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - origin: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 1
          - origin: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 1

    steps:
      - name: Checkout generic sources
        id: sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        id: upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        id: inventory
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','-B','ci.py','inventory','--expected-arch','${{ matrix.arch }}'],check=True)
      - name: Capture all selected public states
        id: capture
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.upstream.outcome == 'success' && steps.inventory.outcome == 'success' }}
        continue-on-error: true
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','-B','causal_ci.py','capture',
                          '--origin','${{ matrix.origin }}','--compiler','${{ matrix.compiler }}',
                          '--config','${{ matrix.config }}','--simd','${{ matrix.simd }}',
                          '--workers','${{ matrix.workers }}','--parallel','2','--timeout','900'],check=True)
      - name: Run paired cache interventions and controls
        id: intervene
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.upstream.outcome == 'success' && steps.inventory.outcome == 'success' }}
        continue-on-error: true
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','-B','causal_ci.py','intervene',
                          '--origin','${{ matrix.origin }}','--compiler','${{ matrix.compiler }}',
                          '--config','${{ matrix.config }}','--simd','${{ matrix.simd }}',
                          '--workers','${{ matrix.workers }}','--parallel','2','--timeout','900'],check=True)
      - name: Require actual measurement gates
        if: always()
        shell: python
        run: |
          outcomes = {'inventory':'${{ steps.inventory.outcome }}',
                      'capture':'${{ steps.capture.outcome }}',
                      'intervene':'${{ steps.intervene.outcome }}'}
          print({'measurement_step_outcomes':outcomes})
          if any(value != 'success' for value in outcomes.values()):
              raise SystemExit(1)
  expanded:
    needs: canonical
    if: github.event.repository.visibility == 'public' && inputs.mode == 'full'
    name: Controls / ${{ matrix.origin }} / ${{ matrix.config }} / SIMD${{ matrix.simd }} / W${{ matrix.workers }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - origin: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: RelWithDebInfo
            simd: 4
            workers: 4
          - origin: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: RelWithDebInfo
            simd: 4
            workers: 4
          - origin: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 4
          - origin: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 4
          - origin: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 4
            workers: 4
          - origin: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: RelWithDebInfo
            simd: 8
            workers: 4
          - origin: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: RelWithDebInfo
            simd: 8
            workers: 4
          - origin: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: RelWithDebInfo
            simd: 8
            workers: 4
          - origin: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: Debug
            simd: 4
            workers: 4
          - origin: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: Debug
            simd: 4
            workers: 4
          - origin: linux-clang-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            compiler: clang
            config: Debug
            simd: 4
            workers: 4
          - origin: macos-clang-arm64
            runner: macos-15
            arch: arm64
            compiler: clang
            config: Debug
            simd: 4
            workers: 4
          - origin: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: Debug
            simd: 4
            workers: 4
          - origin: windows-msvc-x64
            runner: windows-2022
            arch: x86_64
            compiler: msvc
            config: Debug
            simd: 8
            workers: 4
          - origin: linux-gcc-x64
            runner: ubuntu-24.04
            arch: x86_64
            compiler: gcc
            config: Debug
            simd: 8
            workers: 4
          - origin: macos-clang-x64
            runner: macos-15-intel
            arch: x86_64
            compiler: clang
            config: Debug
            simd: 8
            workers: 4

    steps:
      - name: Checkout generic sources
        id: sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Checkout unchanged upstream
        id: upstream
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: erincatto/box3d
          ref: 5d83df83ab47172c2c745b44315e7538ead02397
          path: upstream
          fetch-depth: 1
          persist-credentials: false
      - name: Observe CPU and architecture
        id: inventory
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','-B','ci.py','inventory','--expected-arch','${{ matrix.arch }}'],check=True)
      - name: Run paired cache interventions and controls
        id: intervene
        if: ${{ !cancelled() && steps.sources.outcome == 'success' && steps.upstream.outcome == 'success' && steps.inventory.outcome == 'success' }}
        continue-on-error: true
        shell: python
        run: |
          import subprocess
          subprocess.run(['python','-B','causal_ci.py','intervene',
                          '--origin','${{ matrix.origin }}','--compiler','${{ matrix.compiler }}',
                          '--config','${{ matrix.config }}','--simd','${{ matrix.simd }}',
                          '--workers','${{ matrix.workers }}','--parallel','2','--timeout','900'],check=True)
      - name: Require actual measurement gates
        if: always()
        shell: python
        run: |
          outcomes = {'inventory':'${{ steps.inventory.outcome }}',
                      'intervene':'${{ steps.intervene.outcome }}'}
          print({'measurement_step_outcomes':outcomes})
          if any(value != 'success' for value in outcomes.values()):
